[package]
name = "nvdebug"
version = "0.1.0"
edition = "2021"

[dependencies]
hex = "0.4.3"
uefi-raw = "0.9.0"

[dependencies.iced-x86]
version = "1.21.0"
default-features = false
features = ["no_std","decoder","op_code_info","instr_info","masm"]

[dependencies.windows]
version = "0.58.0"
features = ["Win32_System_Diagnostics_Debug","Win32_System_Threading","Win32_System_SystemServices","Win32_System_SystemInformation","Win32_System_Kernel","Win32_Storage_FileSystem","Win32_Security"]
