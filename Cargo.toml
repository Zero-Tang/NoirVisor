[package]
name = "nvcore"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[profile.dev]
debug = "full"
panic = "abort"

# Disassembler engines have insane binary size.
# Enable optimization even in dev profile.
[profile.dev.package.yaxpeax-x86]
opt-level = "s"

[profile.dev.package.yaxpeax-arch]
opt-level = "s"

[profile.release]
panic = "abort"
debug = "full"
codegen-units = 1
lto = true
opt-level = 3

[workspace]
members = ["crates/loadefi","crates/nvcvm", "src/booting/uefirtdrv"]

[dependencies]
paste = "1.0.15"
nvcvm = {path = "crates/nvcvm"}
spin = "0.10.0"
log = "0.4.29"
bitfield-struct = "0.12.1"
static-collections = "0.2.0"
portable-dlmalloc = "1.3.0"

[dependencies.yaxpeax-x86]
version = "2.0.0"
default-features = false
features = ["fmt"]

[dependencies.yaxpeax-arch]
version = "0.3.2"
default-features = false
features = []
